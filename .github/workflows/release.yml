name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read

env:
  GO_VERSION: "1.24.x"

jobs:
  meta:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Validate release tag
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release tag" >&2; exit 1; }
          commit="$(git rev-list -n1 "$tag")"
          [[ -n "$commit" ]] || { echo "Release tag does not resolve to a commit" >&2; exit 1; }
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify source
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.meta.outputs.commit }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Verify go install from the release tag
        env:
          GOBIN: ${{ runner.temp }}/serveit-bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/Danakolana/ServeIt@${{ needs.meta.outputs.tag }}
          test -x "$GOBIN/ServeIt"

  build:
    name: ${{ matrix.asset }}
    needs: [meta, verify]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: ServeIt-linux-amd64
          - goos: linux
            goarch: arm64
            asset: ServeIt-linux-arm64
          - goos: darwin
            goarch: amd64
            asset: ServeIt-macos-amd64
          - goos: darwin
            goarch: arm64
            asset: ServeIt-macos-arm64
          - goos: windows
            goarch: amd64
            asset: ServeIt-windows-amd64.exe
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.meta.outputs.commit }}
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o "${{ matrix.asset }}" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [meta, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          pattern: ServeIt-*
          merge-multiple: true
      - name: Stage binaries
        run: |
          mkdir -p dist
          find artifacts -type f \( -name 'ServeIt-*' -o -name '*.exe' \) -exec cp -v {} dist/ \;
          test "$(find dist -maxdepth 1 -type f | wc -l)" -ge 5
      - name: Checksums
        run: |
          cd dist
          sha256sum ServeIt-* > SHA256SUMS
      - uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ needs.meta.outputs.commit }}
          name: ${{ needs.meta.outputs.tag }}
          files: |
            dist/ServeIt-linux-amd64
            dist/ServeIt-linux-arm64
            dist/ServeIt-macos-amd64
            dist/ServeIt-macos-arm64
            dist/ServeIt-windows-amd64.exe
            dist/SHA256SUMS
          generate_release_notes: true
