name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.asset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: ServeIt-linux-amd64
          - goos: linux
            goarch: arm64
            asset: ServeIt-linux-arm64
          - goos: darwin
            goarch: amd64
            asset: ServeIt-macos-amd64
          - goos: darwin
            goarch: arm64
            asset: ServeIt-macos-arm64
          - goos: windows
            goarch: amd64
            asset: ServeIt-windows-amd64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -ldflags "-s -w" -o "${{ matrix.asset }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: ServeIt-*
          merge-multiple: true
      - name: Stage binaries
        run: |
          mkdir -p dist
          find artifacts -type f \( -name 'ServeIt-*' -o -name '*.exe' \) -exec cp -v {} dist/ \;
          test "$(find dist -maxdepth 1 -type f | wc -l)" -ge 5
      - name: Checksums
        run: |
          cd dist
          sha256sum ServeIt-* > SHA256SUMS
      - name: Resolve release tag
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag" >&2; exit 1; }
            printf 'tag=%s\n' "$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF#refs/tags/}"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag" >&2; exit 1; }
            printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.tag }}
          files: |
            dist/ServeIt-linux-amd64
            dist/ServeIt-linux-arm64
            dist/ServeIt-macos-amd64
            dist/ServeIt-macos-arm64
            dist/ServeIt-windows-amd64.exe
            dist/SHA256SUMS
          generate_release_notes: true
